<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2433" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#151924" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid)"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="300" cy="200" r="180" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>
  <circle cx="980" cy="500" r="220" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Window Frame -->
  <rect x="80" y="60" width="1120" height="600" rx="16" fill="#111520" stroke="#2a3248" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="1120" height="52" rx="16" fill="#161b2a"/>
  <circle cx="115" cy="86" r="6" fill="#ef4444"/>
  <circle cx="135" cy="86" r="6" fill="#f59e0b"/>
  <circle cx="155" cy="86" r="6" fill="#10b981"/>
  <rect x="440" y="73" width="400" height="26" rx="6" fill="#20273a"/>
  <text x="640" y="91" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">flowcanvas.dev/board/neural-studio</text>

  <!-- Left Sidebar Toolbar -->
  <rect x="80" y="112" width="72" height="548" fill="#131826" stroke="#20273a" stroke-width="1"/>
  <rect x="96" y="132" width="40" height="40" rx="10" fill="url(#accentGrad)"/>
  <circle cx="116" cy="152" r="8" fill="#ffffff" opacity="0.9"/>
  <rect x="101" y="192" width="30" height="30" rx="6" fill="#1f273b"/>
  <rect x="101" y="238" width="30" height="30" rx="6" fill="#1f273b"/>
  <rect x="101" y="284" width="30" height="30" rx="6" fill="#1f273b"/>
  <rect x="101" y="330" width="30" height="30" rx="6" fill="#1f273b"/>

  <!-- Canvas Content: Connected Nodes & Flow Architecture -->
  <!-- Connection Bezier Curves -->
  <path d="M 380 260 C 480 260, 480 370, 580 370" stroke="#8b5cf6" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 380 440 C 480 440, 480 370, 580 370" stroke="#3b82f6" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M 820 370 C 900 370, 920 280, 990 280" stroke="#10b981" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <path d="M 820 370 C 900 370, 920 460, 990 460" stroke="#ec4899" stroke-width="3" fill="none"/>

  <!-- Node 1: Input Source -->
  <rect x="200" y="210" width="180" height="100" rx="12" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="220" y="245" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="14">Data Pipeline</text>
  <text x="220" y="270" fill="#94a3b8" font-family="sans-serif" font-size="11">Real-time Kafka Stream</text>
  <rect x="220" y="285" width="60" height="12" rx="6" fill="#6366f1" opacity="0.4"/>

  <!-- Node 2: Transform -->
  <rect x="200" y="390" width="180" height="100" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="220" y="425" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="14">Vector Store</text>
  <text x="220" y="450" fill="#94a3b8" font-family="sans-serif" font-size="11">Pinecone Embeddings</text>
  <rect x="220" y="465" width="80" height="12" rx="6" fill="#3b82f6" opacity="0.4"/>

  <!-- Center Master Node: AI Agent Engine -->
  <rect x="580" y="290" width="240" height="160" rx="16" fill="#181f33" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)"/>
  <rect x="600" y="315" width="100" height="24" rx="12" fill="#8b5cf6" opacity="0.3"/>
  <text x="650" y="331" fill="#c084fc" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">ACTIVE AGENT</text>
  <text x="600" y="370" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="18">Neural Orchestrator</text>
  <text x="600" y="395" fill="#94a3b8" font-family="sans-serif" font-size="12">GPT-4o Vision + Multi-modal</text>
  <!-- Mini metrics inside center node -->
  <rect x="600" y="415" width="100" height="20" rx="4" fill="#0f172a"/>
  <text x="610" y="429" fill="#10b981" font-family="monospace" font-size="11">Latency: 42ms</text>
  <rect x="710" y="415" width="90" height="20" rx="4" fill="#0f172a"/>
  <text x="720" y="429" fill="#38bdf8" font-family="monospace" font-size="11">Tokens: 1.2M</text>

  <!-- Output Node 1 -->
  <rect x="990" y="230" width="170" height="90" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="1010" y="265" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="14">GraphQL API</text>
  <text x="1010" y="290" fill="#10b981" font-family="monospace" font-size="11">✓ 200 OK • 12k rps</text>

  <!-- Output Node 2 -->
  <rect x="990" y="410" width="170" height="90" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
  <text x="1010" y="445" fill="#f8fafc" font-family="sans-serif" font-weight="600" font-size="14">WebSocket Hub</text>
  <text x="1010" y="470" fill="#f43f5e" font-family="monospace" font-size="11">⚡ Live Sync: Active</text>

  <!-- Floating Active Collaborators Badge -->
  <rect x="960" y="130" width="200" height="44" rx="22" fill="#1c2336" stroke="#2d3748" stroke-width="1"/>
  <circle cx="984" cy="152" r="14" fill="#6366f1"/>
  <text x="984" y="156" fill="#fff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">BP</text>
  <circle cx="1006" cy="152" r="14" fill="#ec4899"/>
  <text x="1006" y="156" fill="#fff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">SL</text>
  <circle cx="1028" cy="152" r="14" fill="#10b981"/>
  <text x="1028" y="156" fill="#fff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">+4</text>
  <text x="1055" y="157" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">Collaborating</text>
</svg>
